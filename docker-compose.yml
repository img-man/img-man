# SPDX-License-Identifier: Apache-2.0
#
# img-man self-hosting stack: application + MongoDB.
#
#   docker compose up -d          → http://localhost:3000  (override: IMAGEMAN_PORT)
#
# Required env (set in shell or a .env file):
#   NEXTAUTH_SECRET               → generate: openssl rand -base64 32
#   ASSET_URL_SIGNING_SECRET      → generate: openssl rand -base64 32
# The defaults below are PLACEHOLDERS for local evaluation only — never
# ship them to an internet-facing host.
#
# Asset storage is bring-your-own-cloud (GCS/S3) and is NOT part of this
# compose file; configure it after first login in Settings → Storage, or
# via the GCP_*/AWS_* variables (see .env.example and docs/configuration.md).
# HEALTHCHECK_REQUIRE_STORAGE=0 keeps readiness DB-only so a fresh stack
# reports healthy before a bucket exists; set it to 1 once storage is wired.
#
# Data: MongoDB persists in the named volume `imageman-mongo-data`.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: imageman/imageman:local
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-nextauth-secret-change-me}
      ASSET_URL_SIGNING_SECRET: ${ASSET_URL_SIGNING_SECRET:-local-dev-asset-secret-change-me}
      AUTH_TRUST_HOST: "true"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/imageman}
      MONGODB_DB: ${MONGODB_DB:-imageman}
      HEALTHCHECK_REQUIRE_STORAGE: ${HEALTHCHECK_REQUIRE_STORAGE:-0}
    ports:
      - '${IMAGEMAN_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    command: ['--bind_ip_all']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - imageman-mongo-data:/data/db

volumes:
  imageman-mongo-data: