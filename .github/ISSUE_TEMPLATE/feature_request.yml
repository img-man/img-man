name: Feature request
description: Suggest an idea for img-man
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Who does this help and in what situation?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
