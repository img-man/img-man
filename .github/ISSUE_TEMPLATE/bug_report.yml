name: Bug report
description: Report a problem with img-man
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: img-man version / commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (Node, OS)
    validations:
      required: true
