version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
    # TypeScript majors (7.x is a new compiler) are adopted deliberately, not by
    # bot PRs. @types/node must match the Node runtime in production (24.x).
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        versions: ['>= 25']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: '/packages/imageman-sdk'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 3
    # TypeScript majors (7.x is a new compiler) are adopted deliberately, not by
    # bot PRs. @types/node must match the Node runtime in production (24.x).
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        versions: ['>= 25']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: '/packages/imageman-mcp-server'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 3
    # TypeScript majors (7.x is a new compiler) are adopted deliberately, not by
    # bot PRs. @types/node must match the Node runtime in production (24.x).
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        versions: ['>= 25']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
    commit-message:
      prefix: chore(ci)
