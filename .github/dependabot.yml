version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: '/packages/imageman-sdk'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: '/packages/imageman-mcp-server'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
    commit-message:
      prefix: chore(ci)
