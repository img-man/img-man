name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build, Test, Coverage, Purity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public purity
        run: npm run verify:public-purity

      - name: Verify SPDX headers
        run: npm run verify:spdx

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:coverage

  # Reported, not enforced. Both are known-failing for reasons tracked in
  # issues rather than fixable in a PR, and blocking on them would make every
  # contribution red for something the contributor did not cause:
  #
  #   lint  - 86 React Compiler diagnostics (setState-in-effect,
  #           refs-during-render) inherited from before the compiler was
  #           enabled. Not runtime failures; the build and full suite pass.
  #   audit - the remaining high/critical advisories sit in transitive
  #           dependencies with no non-breaking fix (@auth/core via next-auth
  #           v4, libvips via sharp, uuid via @google-cloud/storage). The
  #           @auth/core getToken() crash is mitigated in src/proxy.ts.
  #
  # Flip either to a blocking step in the job above once its backlog is clear.
  advisory:
    name: Lint and audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: npm audit (high+)
        continue-on-error: true
        run: npm audit --audit-level=high

  # Blocking: the container image must at least build on every PR and on main.
  # Multi-arch builds and pushes happen only in release.yml from version tags.
  docker:
    name: Docker build (verify only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: img-man:ci

      - name: Smoke test container
        run: |
          docker run -d --name imageman-smoke \
            -e MONGODB_URI="mongodb://127.0.0.1:27017/img-man" \
            -e NEXTAUTH_SECRET="smoke-test-secret" \
            -p 3000:3000 img-man:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health/live >/dev/null; then
              echo "liveness OK"
              docker inspect --format '{{.State.Running}}' imageman-smoke | grep -q true
              docker stop imageman-smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become live"
          docker logs imageman-smoke
          exit 1
