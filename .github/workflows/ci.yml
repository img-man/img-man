name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build, Test, Coverage, Purity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public purity
        run: npm run verify:public-purity

      - name: Verify SPDX headers
        run: npm run verify:spdx

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:coverage

  # Reported, not enforced. Both are known-failing for reasons tracked in
  # issues rather than fixable in a PR, and blocking on them would make every
  # contribution red for something the contributor did not cause:
  #
  #   lint  - 86 React Compiler diagnostics (setState-in-effect,
  #           refs-during-render) inherited from before the compiler was
  #           enabled. Not runtime failures; the build and full suite pass.
  #   audit - the remaining high/critical advisories sit in transitive
  #           dependencies with no non-breaking fix (@auth/core via next-auth
  #           v4, libvips via sharp, uuid via @google-cloud/storage). The
  #           @auth/core getToken() crash is mitigated in src/proxy.ts.
  #
  # Flip either to a blocking step in the job above once its backlog is clear.
  advisory:
    name: Lint and audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: npm audit (high+)
        continue-on-error: true
        run: npm audit --audit-level=high

  # Blocking: real Docker Compose integration smoke test — the same stack a
  # self-hosting user runs (`docker compose up -d`), including MongoDB.
  # Multi-arch builds and pushes happen only in release.yml from version tags.
  docker-compose-smoke:
    name: Docker Compose integration smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and start the stack
        run: |
          docker compose -p imageman-ci up -d --build --wait --wait-timeout 300

      - name: Verify health endpoints
        run: |
          echo "GET /api/health/live:"
          curl -fsS http://127.0.0.1:3000/api/health/live
          echo
          echo "GET /api/health/ready:"
          curl -fsS http://127.0.0.1:3000/api/health/ready
          echo
          # The compose healthcheck gates on /api/health/ready, so --wait
          # already proved readiness; assert the app is still running after
          # the endpoint checks.
          test -n "$(docker compose -p imageman-ci ps --status running -q app)"
          echo "app container running"

      - name: Collect logs on failure
        if: failure()
        run: docker compose -p imageman-ci logs --no-color

      - name: Tear down the stack
        if: always()
        run: docker compose -p imageman-ci down -v --remove-orphans
