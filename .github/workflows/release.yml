name: Release

# Runs from version tags only (vMAJOR.MINOR.PATCH). `latest` is published
# only from a successful, fully-validated stable release — never from
# arbitrary main commits. See docs/releases.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create GitHub Release
  packages: write # push to GHCR
  id-token: write # build provenance / SBOM attestations

env:
  GHCR_IMAGE: ghcr.io/img-man/img-man

jobs:
  quality:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag must correspond to the version declared in package.json,
      # so the image and the GitHub Release always describe the same source.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify public purity
        run: npm run verify:public-purity

      - name: Verify SPDX headers
        run: npm run verify:spdx

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Generate SBOM
        run: npm run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  image:
    name: Build, scan, publish container
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/img-man', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build locally (amd64 only) WITHOUT pushing, so the vulnerability scan
      # and the container smoke test can run against the real artifact first.
      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: img-man:validated

      - name: Smoke test container
        run: |
          docker run -d --name imageman-release \
            -e MONGODB_URI="mongodb://127.0.0.1:27017/img-man" \
            -e NEXTAUTH_SECRET="release-smoke-secret" \
            -p 3000:3000 img-man:validated
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health/live >/dev/null; then
              echo "liveness OK"
              docker stop imageman-release
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become live"
          docker logs imageman-release
          exit 1

      # Publication policy: fail only on CRITICAL vulnerabilities that have a
      # fix available (--ignore-unfixed). Unfixable transitive advisories are
      # triaged in SECURITY.md's dependency policy instead of hard-blocking
      # every release. See docs/releases.md.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: img-man:validated
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Final multi-arch publish. GHA build cache makes this reuse the layers
      # from the validation build.
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft=false \
            --latest \
            --generate-notes \
            --title "img-man $GITHUB_REF_NAME" \
            release-assets/sbom.cdx.json
